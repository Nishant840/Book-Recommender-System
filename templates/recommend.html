<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .navbar {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
        }
        .navbar-brand {
            color: white !important;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .btn-recommend {
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 30px;
            transition: 0.2s;
        }
        .btn-recommend:hover {
            opacity: 0.9;
        }
        .book-card {
            height: 100%;
            min-height: 320px;  /* adjust as needed */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        }
        .book-card img {
            max-height: 180px;
            object-fit: contain;
        }
        .card-body {
            flex-grow: 1;
        }
        .card-body p {
            margin: 4px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/">📚 Book Recommendation System</a>
        </div>
    </nav>

    <div class="container mt-5">

        <div class="text-center mb-4">
            <h2 class="fw-bold">Get Book Recommendation</h2>
        </div>

        <div class="row justify-content-center">

            <div class="col-md-6">
                <form action="/recommend_books" method="POST">
                    <div class="mb-3">
                        <input type="text" class="form-control form-control-lg" 
                               name="user_input" placeholder="Enter a book name" required>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-recommend">Submit</button>
                    </div>
                </form>
            </div>

            {% if message %}
                <div class="alert alert-danger text-center mt-4">
                    {{ message }}
                </div>
            {% endif %}
            
            {% if data %}
                <div class="container mt-5">
                    <h3 class="fw-bold text-center mb-4">Recommended Books</h3>
                    <div class="row g-4">
                        {% for i in data %}
                            <div class="col-md-3">
                                <div class="card book-card text-center">
                                    <div class="card-body">
                                        <img src="{{ i[2] }}" class="card-img-top mb-2" alt="Book Image">
                                        <p class="fw-bold">{{ i[0] }}</p>
                                        <p class="text-muted">{{ i[1] }}</p>
                                    </div>
                                </div>
                            </div>
                        {% endfor %}
                    </div>
                </div>
            {% endif %}
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
