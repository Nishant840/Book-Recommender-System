<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
        background-color: #f8fafc;
        font-family: 'Segoe UI', Roboto, sans-serif;
        }
        .navbar {
        background: linear-gradient(90deg, #4f46e5, #7c3aed);
        }
        .navbar-brand {
        color: white !important;
        font-weight: 600;
        letter-spacing: 0.5px;
        }
        .book-card {
        border-radius: 14px;
        box-shadow: 0 6px 16px rgba(0,0,0,0.08);
        transition: transform 0.2s;
        }
        .book-card:hover {
        transform: translateY(-5px);
        }
        .btn-recommend {
        background: linear-gradient(90deg, #4f46e5, #7c3aed);
        border: none;
        color: white;
        font-weight: 600;
        padding: 12px 24px;
        border-radius: 30px;
        transition: 0.2s;
        }
        .btn-recommend:hover {
        opacity: 0.9;
        }
        .book-card {
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .card-body p {
            margin: 5px;
            font-size: 14px;
            line-height: 1.2;
        }
        .card-body img {
            max-height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
        <a class="navbar-brand" href="/">📚 Book Recommendation System</a>
        </div>
    </nav>

    <div class="container mt-5 mb-3">
        <div class="text-center mb-4">
            <a class="btn btn-recommend" href="/recommendation">Get Recommendation</a>
        </div>
    </div>

    <div class="container mb-5"> 
        <div class="text-center mb-4">
            <h2 class="fw-bold">Top 50 Books</h2>
            <p class="text-muted">Based on average ratings (min. 250 user ratings)</p>
        </div>

        <div class="row g-4">

            {% for i in range(book_name|length) %}

                <div class="col-3">
                    <div class="card book-card">
                        <div class="card-body text-center">
                            <img class="card-img-top mb-2" src="{{ image[i] }}" alt="img">
                            <p class="fw-bold">{{ book_name[i] }}</p>
                            <p class="text-muted">{{ author[i] }} </p>
                            <p>Votes: {{ votes[i] }}</p>
                            <p>Rating: {{ '%.2f' | format(rating[i]) }}</p>
                        </div>
                    </div>
                </div>

            {% endfor %}

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
