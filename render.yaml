services:
  - type: web
    name: book-recommender-app
    env: python
    buildCommand: |
      pyenv install 3.11.9 -s
      pyenv global 3.11.9
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9